
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksage-ai"
version = "0.1.0"
description = "Multi-agent financial research assistant for Indian equities"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "pydantic>=2",
    "pandas",
    "numpy",
    "python-dotenv",
    "yfinance",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
